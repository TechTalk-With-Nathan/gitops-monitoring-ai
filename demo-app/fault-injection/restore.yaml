## Fault Injection: Restore to Normal State
##
## Apply this to revert all injected faults.
## ArgoCD will sync and bring deployments back to healthy config.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-productcatalogservice
  namespace: demo-app
  annotations:
    fault-injection/type: "none"
    fault-injection/active: "false"
spec:
  template:
    spec:
      containers:
        - name: productcatalogservice
          env:
            - name: PRODUCT_CATALOG_FAILURE
              value: "false"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-recommendationservice
  namespace: demo-app
  annotations:
    fault-injection/type: "none"
    fault-injection/active: "false"
spec:
  template:
    spec:
      containers:
        - name: recommendationservice
          env:
            - name: RECOMMENDATION_SERVICE_CACHE_FAILURE
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-adservice
  namespace: demo-app
  annotations:
    fault-injection/type: "none"
    fault-injection/active: "false"
spec:
  template:
    spec:
      containers:
        - name: adservice
          env:
            - name: AD_SERVICE_FAILURE
              value: "false"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=demo-app,deployment.environment=demo"
