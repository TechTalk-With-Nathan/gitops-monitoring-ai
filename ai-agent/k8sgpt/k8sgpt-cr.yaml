apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt
  namespace: k8sgpt-operator-system
spec:
  ai:
    enabled: true
    model: llama3.2:3b
    backend: ollama
    baseUrl: http://ollama.ai-agent.svc.cluster.local:11434
    language: english
    anonymized: false

  filters:
    - Pod
    - Deployment
    - ReplicaSet
    - StatefulSet
    - DaemonSet
    - Service
    - Ingress
    - HorizontalPodAutoscaler
    - PodDisruptionBudget

  noCache: false
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.3.41
